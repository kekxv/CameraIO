name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Keep every CI test on the same compiler-free build path as releases.
env:
  CGO_ENABLED: "0"

jobs:
  # ===========================================
  # 后端测试 (多平台)
  # 前端先构建：//go:embed frontend/dist 要求编译时 dist 存在
  # ===========================================
  test-backend:
    name: Backend Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - macos-latest # 暂停 macOS runner，避免产生额外费用
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (needed for //go:embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: Go version
        run: go version

      - name: Go vet
        run: go vet ./...

      - name: Go test (coverage)
        run: go test ./... -coverprofile=coverage.out -count=1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out

  # ===========================================
  # 前端构建验证
  # ===========================================
  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        working-directory: frontend
        run: |
          ls -la dist/
          test -f dist/index.html && echo "✅ frontend build OK"

  # ===========================================
  # 综合检查 (Linux 快速)
  # ===========================================
  check:
    name: Full Check (vet + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (needed for //go:embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -v -count=1

      - name: Build binaries
        run: |
          go build -o /tmp/cameraio ./cmd/server/
          go build -o /tmp/localcam ./cmd/localcam/
          echo "✅ binaries built"

      - name: Verify server starts + embedded frontend serves
        run: |
          /tmp/cameraio &
          SERVER_PID=$!
          sleep 3
          curl -s http://localhost:8080/health || (echo "❌ server health check failed"; kill $SERVER_PID; exit 1)
          echo "✅ server health check OK"
          # 前端已嵌入二进制，任意目录下都应能访问（SPA 根路径）
          curl -s http://localhost:8080/ | grep -q '<div id="app">' || (echo "❌ embedded frontend not served"; kill $SERVER_PID; exit 1)
          echo "✅ embedded frontend served from binary"
          kill $SERVER_PID
