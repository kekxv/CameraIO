name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ===========================================
  # 后端测试 (多平台)
  # ===========================================
  test-backend:
    name: Backend Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Go version
        run: go version

      - name: Go vet
        run: go vet ./...

      - name: Go test (race detector)
        env:
          CGO_ENABLED: 1
        run: go test ./... -race -count=1

      - name: Go test (with coverage)
        env:
          CGO_ENABLED: 1
        run: go test ./... -coverprofile=coverage.out -count=1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out

  # ===========================================
  # 前端构建验证
  # ===========================================
  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        working-directory: frontend
        run: |
          ls -la dist/
          test -f dist/index.html && echo "✅ frontend build OK"

  # ===========================================
  # 综合检查 (Linux 快速)
  # ===========================================
  check:
    name: Full Check (vet + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install FFmpeg (test dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Go vet
        run: go vet ./...

      - name: Go test
        env:
          CGO_ENABLED: 1
        run: go test ./... -v -count=1

      - name: Build binaries
        run: |
          go build -o /tmp/cameraio ./cmd/server/
          go build -o /tmp/localcam ./cmd/localcam/
          echo "✅ binaries built"

      - name: Verify server starts
        run: |
          /tmp/cameraio &
          SERVER_PID=$!
          sleep 3
          curl -s http://localhost:8080/health || (echo "❌ server health check failed"; kill $SERVER_PID; exit 1)
          echo "✅ server health check OK"
          kill $SERVER_PID
