name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ===========================================
  # 测试门禁：测试通过后才会执行构建
  # ===========================================
  test:
    name: Test (gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (needed for //go:embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go test
        env:
          CGO_ENABLED: 1
        run: go test ./... -count=1

  # ===========================================
  # Linux 构建 (amd64 + arm64)
  # ===========================================
  build-linux:
    name: Linux (${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (needed for //go:embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: Install cross-compiler (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build backend
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
          CGO_ENABLED: 1
        run: |
          go build -ldflags="-s -w" -o cameraio-linux-${{ matrix.arch }} ./cmd/server/

      - name: Build localcam
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
          CGO_ENABLED: 1
        run: |
          go build -ldflags="-s -w" -o localcam-linux-${{ matrix.arch }} ./cmd/localcam/

      - name: Package
        run: |
          mkdir -p dist/cameraio-linux-${{ matrix.arch }}
          cp cameraio-linux-${{ matrix.arch }} dist/cameraio-linux-${{ matrix.arch }}/cameraio
          cp localcam-linux-${{ matrix.arch }} dist/cameraio-linux-${{ matrix.arch }}/localcam
          cp README.md API.md dist/cameraio-linux-${{ matrix.arch }}/ || true
          cd dist && tar -czf cameraio-linux-${{ matrix.arch }}.tar.gz cameraio-linux-${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cameraio-linux-${{ matrix.arch }}
          path: dist/cameraio-linux-${{ matrix.arch }}.tar.gz

  # ===========================================
  # Windows 构建 (Win7+ 兼容, amd64)
  # ===========================================
  build-windows:
    name: Windows (amd64, Win7+)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (needed for //go:embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: Build backend
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 1
          # 控制台模式：双击 exe 可看到运行日志（不隐藏控制台窗口）
          LDFLAGS: -s -w
        run: |
          go build -ldflags="$env:LDFLAGS" -o cameraio.exe ./cmd/server/
          go build -ldflags="-s -w" -o localcam.exe ./cmd/localcam/

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path dist/cameraio-windows-amd64
          Copy-Item cameraio.exe dist/cameraio-windows-amd64/
          Copy-Item localcam.exe dist/cameraio-windows-amd64/
          Copy-Item README.md dist/cameraio-windows-amd64/ -ErrorAction SilentlyContinue
          Copy-Item API.md dist/cameraio-windows-amd64/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/cameraio-windows-amd64 -DestinationPath dist/cameraio-windows-amd64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cameraio-windows-amd64
          path: dist/cameraio-windows-amd64.zip

  # ===========================================
  # macOS 构建 (universal: amd64 + arm64)
  # ===========================================
  build-macos:
    name: macOS (universal)
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (needed for //go:embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: Build backend (Intel)
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 1
        run: |
          go build -ldflags="-s -w" -o cameraio-darwin-amd64 ./cmd/server/
          go build -ldflags="-s -w" -o localcam-darwin-amd64 ./cmd/localcam/

      - name: Build backend (Apple Silicon)
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 1
        run: |
          go build -ldflags="-s -w" -o cameraio-darwin-arm64 ./cmd/server/
          go build -ldflags="-s -w" -o localcam-darwin-arm64 ./cmd/localcam/

      - name: Create universal binary
        run: |
          lipo -create -output cameraio cameraio-darwin-amd64 cameraio-darwin-arm64
          lipo -create -output localcam localcam-darwin-amd64 localcam-darwin-arm64

      - name: Package
        run: |
          mkdir -p dist/cameraio-macos-universal
          cp cameraio dist/cameraio-macos-universal/
          cp localcam dist/cameraio-macos-universal/
          cp README.md API.md dist/cameraio-macos-universal/ || true
          cd dist && tar -czf cameraio-macos-universal.tar.gz cameraio-macos-universal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cameraio-macos-universal
          path: dist/cameraio-macos-universal.tar.gz

  # ===========================================
  # 发布 (仅 tag 触发)
  # ===========================================
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
